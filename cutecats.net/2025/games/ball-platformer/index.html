<head>

    <title>Ball Platformer</title>

    <link rel="icon" type="image/png" href="../../../site-shared/favicon.png">


    <style>
        * {
            box-sizing: border-box;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        html, body, main, canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: black;
        }
        body {
            display: flex;
            flex-direction: column;
            touch-action: none; /* disables zooming/moving/scrolling the page on phone */
        }
        html:has(.is-touch-device) {
            /* so we dont select whole page because safari is stupid */
            user-select: none;
            -webkit-user-select: none; /* seems to be needed on safari */
        }
        main {
            height: auto;
            flex: 1;
            position: relative; /* put position absolute children relative to this */
        }


        #touch-controls {
            width: 80%;
            left: 10%;
            height: 15%;
            bottom: 8%;
            position: absolute;
            display: /*flex*/ none;
            user-select: none;
            -webkit-user-select: none; /* seems to be needed on safari */
        }
        .is-touch-device #touch-controls {
            display: flex;
        }
        #touch-controls div {
            background: #333333;
            flex: 1;
            font-size: 10vh;
            text-align: center;
            color: white;
            font-family: monospace;
            border: 1vh solid #444444;
            border-radius: 5vh;
        }
        #touch-controls div.is-being-touched {
            background-color: gray;
        }
        #touch-right {
            margin-right: 25%;
        }


        #editor-div {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            outline: 1px solid yellow;
            outline-offset: -1px;
            pointer-events: none; /* let clicks pass through */
        }
        #editor-div > * {
            pointer-events: auto;
        }
        .edit-mode #editor-div {
            display: block;
        }

        #editor-right {
            position: absolute;
            top: 10%;
            right: 4%;
            width: 16%;
            height: 80%;
            background: gray;
            display: flex;
            flex-direction: column;
        }
        #editor-right > div {
            background: gray;
            border: 2px outset;
        }
        #props-panel h1 {
            text-align: center;
            font-size: 1.2rem;
        }

        #props-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 4px;

            font-size: 1.2rem;
            user-select: none;

            overflow-y: auto;
        }
        #props-panel p {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #props-panel input {
            font-size: 1em;
            background: lightgray;
            border: 2px inset;
            padding: 1px;
            width: 0;
            flex: 1;
        }
    </style>
</head>
